name: Release Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os_label: macos-apple-silicon
            python_extra: mlx
          - platform: windows-latest
            os_label: windows-x64
            python_extra: torch

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg for bundling (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg for bundling (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Python backend dependencies (macOS Apple Silicon MLX)
        if: runner.os == 'macOS'
        working-directory: backend
        run: uv sync --extra mlx --extra dev --prerelease=allow

      - name: Install Python backend dependencies (Windows x64)
        if: runner.os == 'Windows'
        working-directory: backend
        run: uv sync --extra torch --extra dev --prerelease=allow

      - name: Build standalone AI engine + bundle FFmpeg (${{ matrix.os_label }})
        working-directory: backend
        run: uv run --no-sync python scripts/build_sidecar.py

      - name: Build Tauri desktop installer
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json

      - name: Publish installers to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          name: "VoxLoom ${{ github.ref_name }}"
          body: |
            ## VoxLoom Local Voice Cloning Studio

            - **Windows 11/10 (x64)**: Download `VoxLoom_*_x64-setup.exe` (includes bundled Python AI engine + `ffmpeg.exe`/`ffprobe.exe`). Recommended model for RTX 3050 / 16 GB RAM PCs: **Qwen3-TTS 0.6B Base** (~1.5 GB).
            - **macOS (Apple Silicon M1–M4)**: Download `VoxLoom_*_aarch64.dmg` (uses native Apple Metal `mlx-audio` + bundled `ffmpeg`).

            > Model weights download directly inside the app from Hugging Face Hub on first launch and cache locally for 100% offline use.
            >
            > **NVIDIA CUDA GPU Acceleration on Windows**: Because PyTorch's CUDA 12.4 wheel (~2.4 GB) exceeds GitHub Releases' 2 GB single-file limit, the standalone `.exe` ships with universal CPU support out of the box. For full RTX 3050 CUDA speed, see the README's 3-line Windows CUDA setup.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
