name: Release Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os_label: macos-apple-silicon
            python_extra: mlx
          - platform: windows-latest
            os_label: windows-x64
            python_extra: torch

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Download standalone static FFmpeg/FFprobe (macOS arm64)
        if: runner.os == 'macOS'
        run: |
          mkdir -p /tmp/static-ffmpeg
          curl -fsSL -o /tmp/static-ffmpeg/ffmpeg https://github.com/descriptinc/ffmpeg-ffprobe-static/releases/download/b6.1.2-rc.1/ffmpeg-darwin-arm64
          curl -fsSL -o /tmp/static-ffmpeg/ffprobe https://github.com/descriptinc/ffmpeg-ffprobe-static/releases/download/b6.1.2-rc.1/ffprobe-darwin-arm64
          chmod 755 /tmp/static-ffmpeg/ffmpeg /tmp/static-ffmpeg/ffprobe
          /tmp/static-ffmpeg/ffmpeg -version | head -n 1
          echo "VOXLOOM_BUNDLE_FFMPEG=/tmp/static-ffmpeg/ffmpeg" >> "$GITHUB_ENV"
          echo "VOXLOOM_BUNDLE_FFPROBE=/tmp/static-ffmpeg/ffprobe" >> "$GITHUB_ENV"

      - name: Install FFmpeg for bundling (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Python backend dependencies (macOS Apple Silicon MLX)
        if: runner.os == 'macOS'
        working-directory: backend
        run: uv sync --extra mlx --extra dev --prerelease=allow

      - name: Install Python backend dependencies (Windows x64)
        if: runner.os == 'Windows'
        working-directory: backend
        run: uv sync --extra torch --extra dev --prerelease=allow

      - name: Build standalone AI engine + bundle FFmpeg (${{ matrix.os_label }})
        working-directory: backend
        run: uv run --no-sync python scripts/build_sidecar.py

      - name: Smoke test bundled AI engine (macOS)
        if: runner.os == 'macOS'
        run: |
          test -d src-tauri/resources/engine/_internal
          src-tauri/resources/engine/ffmpeg -version | head -n 1
          src-tauri/resources/engine/voxloom-engine --host 127.0.0.1 --port 18765 &
          PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18765/api/system/health; then
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          kill $PID || true
          exit 1

      - name: Smoke test bundled AI engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/resources/engine/_internal")) { throw "Missing _internal folder!" }
          & src-tauri/resources/engine/ffmpeg.exe -version | Select-Object -First 1
          $proc = Start-Process -FilePath "src-tauri/resources/engine/voxloom-engine.exe" -ArgumentList "--host 127.0.0.1 --port 18765" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/system/health" -TimeoutSec 2
              if ($resp.status -eq "ok") { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Bundled Windows engine failed health check!" }

      - name: Build Tauri app bundle & ad-hoc deep-sign (macOS)
        if: runner.os == 'macOS'
        run: |
          pnpm tauri build --bundles app --config src-tauri/tauri.release.conf.json
          APP="src-tauri/target/release/bundle/macos/VoxLoom.app"
          test -d "$APP/Contents/Resources/engine/_internal"
          chmod -R u+w "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p src-tauri/target/release/bundle/dmg /tmp/dmg_stage
          cp -R "$APP" /tmp/dmg_stage/
          ln -s /Applications /tmp/dmg_stage/Applications
          VERSION=$(node -p "require('./package.json').version")
          hdiutil create -volname "VoxLoom" -srcfolder /tmp/dmg_stage -ov -format UDZO "src-tauri/target/release/bundle/dmg/VoxLoom_${VERSION}_aarch64.dmg"

      - name: Build Tauri NSIS installer (Windows)
        if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Publish installers to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          name: "VoxLoom ${{ github.ref_name }}"
          body: |
            ## VoxLoom Local Voice Cloning Studio

            - **Windows 11/10 (x64)**: Download `VoxLoom_*_x64-setup.exe` (includes bundled Python AI engine + static `ffmpeg.exe`/`ffprobe.exe`). Recommended model for RTX 3050 / 16 GB RAM PCs: **Qwen3-TTS 0.6B Base** (~1.5 GB).
            - **macOS (Apple Silicon M1–M4)**: Download `VoxLoom_*_aarch64.dmg` (native Apple Metal `mlx-audio` + standalone static `ffmpeg`/`ffprobe`, ad-hoc deep-signed).

            ### First-Launch Note (Unsigned Open-Source Build)
            - **macOS**: Drag `VoxLoom.app` to **Applications**, then run once in Terminal to clear browser download quarantine:
              ```bash
              xattr -cr /Applications/VoxLoom.app
              ```
              *(Because this free open-source release is not notarized with a paid Apple Developer ID, macOS shows `"VoxLoom is damaged"` on browser downloads until quarantine is cleared.)*
            - **Windows**: Click **More info → Run anyway** on Windows SmartScreen.

            > Model weights download directly inside the app from Hugging Face Hub on first launch and cache locally for 100% offline use.
            >
            > **NVIDIA CUDA GPU Acceleration on Windows**: For full RTX 3050 CUDA 12.4 speed (since PyTorch CUDA wheels exceed GitHub's 2 GB per-file release limit), run `.\scripts\run-windows-cuda.ps1` from PowerShell.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
