[package]
name = "voxloom"
version = "0.1.2"
description = "Local-first voice cloning & timeline gap-fill studio"
authors = ["VoxLoom Contributors"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "voxloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
