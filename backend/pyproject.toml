[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxloom-backend"
version = "0.1.4"
description = "Cross-platform local voice cloning AI engine for VoxLoom (macOS MLX + Windows/Linux CUDA & CPU)"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pydantic>=2.10.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "huggingface-hub>=0.28.0",
    "soundfile>=0.12.1",
    "certifi>=2024.0.0",
    "truststore>=0.10.0",
]

[project.optional-dependencies]
# Apple Silicon macOS (Metal GPU acceleration)
mlx = [
    "mlx-audio>=0.6.0",
    "transformers>=4.48.0",
]
# Windows / Linux (NVIDIA CUDA or CPU fallback)
torch = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "transformers>=4.48.0",
    "accelerate>=1.2.0",
    "qwen-tts>=0.1.0",
    "faster-whisper>=1.1.0",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "pyinstaller>=6.11.0",
]

[project.scripts]
voxloom-engine = "voxloom_backend.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["voxloom_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
prerelease = "allow"
conflicts = [
    [
        { extra = "mlx" },
        { extra = "torch" },
    ],
]
